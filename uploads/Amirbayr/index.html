<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Амирбаяр ХХК — PPR хоолой, фитинг</title>
<link rel="stylesheet" href="colors_and_type.css"/>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; }
  ::selection { background: #EB1E24; color: #fff; }
  html { scroll-behavior: smooth; }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.4); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* table mobile responsiveness */
  @media (max-width: 720px) {
    .row-grid-3 { grid-template-columns: 1fr !important; gap: 16px !important; }
    .row-grid-2 { grid-template-columns: 1fr !important; }
    .hero-grid { grid-template-columns: 1fr !important; }
    .nav-links { display: none !important; }
    .stats-grid { grid-template-columns: repeat(2,1fr) !important; gap: 24px !important; }
    .features-grid { grid-template-columns: 1fr !important; }
    .display-h1 { font-size: 44px !important; }
    .section-h2 { font-size: 32px !important; }
    .section-pad { padding: 64px 5% !important; }
    .pdt-cell { padding: 12px 10px !important; font-size: 13px !important; }
    .group-tabs { flex-wrap: wrap; }
  }

  /* scroll-margin so anchored sections clear sticky nav */
  section[id] { scroll-margin-top: 72px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="products.js"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
